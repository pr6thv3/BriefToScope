name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DEMO_MODE: "true"
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_SERVICE_ROLE_KEY: "mock_key"
        run: python -m pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for common secret patterns
        shell: bash
        run: |
          if grep -RInE "(sk_live_[A-Za-z0-9_]{12,}|sk_test_[A-Za-z0-9_]{12,}|whsec_[A-Za-z0-9_]{12,}|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9._-]{20,}|PAYPAL_CLIENT_SECRET=[A-Za-z0-9._-]{20,}|OPENAI_API_KEY=sk-[A-Za-z0-9._-]{20,})" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next .; then
            echo "Potential secret found. Review before merging."
            exit 1
          fi
