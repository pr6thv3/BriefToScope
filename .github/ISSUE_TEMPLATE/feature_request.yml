name: Feature request
description: Propose a product improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Launch blocker
        - Paid beta
        - Post-launch
        - Long-term
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
