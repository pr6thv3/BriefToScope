services:
  api:
    build:
      context: ./backend
    environment:
      DEMO_MODE: "true"
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "false"
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app.celery_app worker -Q ai_generation,pdf_exports,emails,billing --loglevel=info
    environment:
      DEMO_MODE: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    profiles:
      - workers

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
